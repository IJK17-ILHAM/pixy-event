<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dasbor Pengelola & Manajemen Acara</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FAEEE8; color: #1C1B1F; }
    .font-serif-chic { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-8">

  <!-- GERBANG LOGIN -->
  <div id="loginScreen" class="fixed inset-0 bg-[#FAEEE8] flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-[2.5rem] shadow-xl border border-[#F7C1D1] max-w-sm w-full p-8 text-center">
      <div class="w-14 h-14 bg-[#F7C1D1] text-[#1C1B1F] rounded-full flex items-center justify-center mx-auto mb-4 text-xl border border-[#D4A394]">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2 class="font-serif-chic text-2xl font-bold text-[#1C1B1F]">Login Pengelola</h2>
      <p class="text-xs text-[#8E6145] mt-1 mb-6">Akses khusus admin acara & keuangan.</p>

      <form onsubmit="handleAdminLogin(event)" class="space-y-4 text-left">
        <div>
          <label class="block text-xs font-semibold text-[#8E6145] mb-1">Username</label>
          <input type="text" id="adminUser" required placeholder="admin" class="w-full px-4 py-3 rounded-2xl border border-[#D4A394] text-sm focus:ring-2 focus:ring-[#8E6145] outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-[#8E6145] mb-1">Password</label>
          <input type="password" id="adminPass" required placeholder="admin" class="w-full px-4 py-3 rounded-2xl border border-[#D4A394] text-sm focus:ring-2 focus:ring-[#8E6145] outline-none">
        </div>
        <div class="bg-[#FAEEE8] p-2.5 rounded-xl text-[11px] text-center text-[#8E6145]">
          Akses Default: <b class="font-mono text-[#1C1B1F]">admin</b> / <b class="font-mono text-[#1C1B1F]">admin</b>
        </div>
        <button type="submit" class="w-full py-3.5 bg-[#1C1B1F] hover:bg-[#8E6145] text-white font-semibold rounded-full text-sm transition">
          Masuk ke Dasbor
        </button>
      </form>
    </div>
  </div>

  <!-- DASBOR UTAMA ADMIN -->
  <div id="adminDashboard" class="hidden max-w-7xl mx-auto w-full space-y-8">

    <!-- Header Panel -->
    <div class="bg-[#1C1B1F] rounded-[2rem] p-6 sm:p-8 text-white flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <span class="text-xs bg-[#A3D9C9] text-[#1C1B1F] px-3 py-1 rounded-full font-bold uppercase tracking-wider">Akses Penuh Admin</span>
        <h1 class="font-serif-chic text-2xl sm:text-3xl font-bold mt-2">Dasbor Pengelola Acara</h1>
        <p class="text-[#D4A394] text-xs sm:text-sm">Kelola pendaftaran, QRIS, dan lokasi acara secara real-time.</p>
      </div>
      <div class="flex flex-wrap gap-2">
        <button onclick="fetchSheetData()" class="px-4 py-2.5 bg-white/10 hover:bg-white/20 text-white rounded-full text-xs font-semibold transition flex items-center gap-2">
          <i class="fa-solid fa-rotate"></i> Refresh
        </button>
        <button onclick="openSettingsModal()" class="px-4 py-2.5 bg-[#D4A394] hover:bg-[#8E6145] text-[#1C1B1F] hover:text-white rounded-full text-xs font-semibold transition flex items-center gap-2">
          <i class="fa-solid fa-qrcode"></i> Pengaturan & QRIS
        </button>
        <button onclick="logoutAdmin()" class="px-4 py-2.5 bg-rose-600 hover:bg-rose-700 text-white rounded-full text-xs font-semibold transition flex items-center gap-2">
          <i class="fa-solid fa-right-from-bracket"></i> Keluar
        </button>
      </div>
    </div>

    <!-- Ringkasan Global KPI -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="bg-white p-5 rounded-3xl border border-[#F7C1D1] shadow-sm">
        <p class="text-[11px] text-[#8E6145] uppercase font-bold tracking-wider">Total Pendaftar</p>
        <h4 class="font-serif-chic text-3xl font-bold text-[#1C1B1F] mt-1" id="stat-total">0</h4>
      </div>
      <div class="bg-white p-5 rounded-3xl border border-[#F7C1D1] shadow-sm">
        <p class="text-[11px] text-amber-700 uppercase font-bold tracking-wider">Perlu Validasi</p>
        <h4 class="font-serif-chic text-3xl font-bold text-amber-700 mt-1" id="stat-pending">0</h4>
      </div>
      <div class="bg-white p-5 rounded-3xl border border-[#F7C1D1] shadow-sm">
        <p class="text-[11px] text-emerald-700 uppercase font-bold tracking-wider">Terverifikasi</p>
        <h4 class="font-serif-chic text-3xl font-bold text-emerald-700 mt-1" id="stat-verified">0</h4>
      </div>
      <div class="bg-white p-5 rounded-3xl border border-[#F7C1D1] shadow-sm">
        <p class="text-[11px] text-[#8E6145] uppercase font-bold tracking-wider">Hadir (Sertifikat)</p>
        <h4 class="font-serif-chic text-3xl font-bold text-[#8E6145] mt-1" id="stat-attended">0</h4>
      </div>
    </div>

    <!-- TAB MENU NAVIGASI ADMIN -->
    <div class="flex flex-wrap items-center gap-2 p-1.5 bg-white rounded-full border border-[#F7C1D1] max-w-fit shadow-sm">
      <button onclick="switchAdminTab('peserta')" id="tab-btn-peserta" class="px-5 py-2.5 rounded-full text-xs font-bold transition bg-[#1C1B1F] text-white shadow-sm flex items-center gap-2">
        <i class="fa-solid fa-users"></i>
        <span>Data Pendaftar</span>
      </button>
      <button onclick="switchAdminTab('statistik')" id="tab-btn-statistik" class="px-5 py-2.5 rounded-full text-xs font-bold transition text-[#8E6145] hover:bg-[#FAEEE8] flex items-center gap-2">
        <i class="fa-solid fa-chart-pie text-[#D4A394]"></i>
        <span>Statistik Kategori Acara</span>
      </button>
      <button onclick="switchAdminTab('acara')" id="tab-btn-acara" class="px-5 py-2.5 rounded-full text-xs font-bold transition text-[#8E6145] hover:bg-[#FAEEE8] flex items-center gap-2">
        <i class="fa-solid fa-ticket text-[#D4A394]"></i>
        <span>Kelola Acara & Tiket</span>
      </button>
    </div>

    <!-- PANEL 1: DATA PENDAFTAR -->
    <section id="panel-peserta" class="space-y-4">
      <div class="bg-white rounded-[2rem] border border-[#F7C1D1] shadow-sm overflow-hidden">
        <div class="px
